[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-mesher"
version = "0.1.0"
description = "Geometry description to conforming triangle meshes (Gmsh) with named domains and boundaries"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }  # links Gmsh (GPL)
dependencies = ["gmsh>=4.11", "numpy>=1.24", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
