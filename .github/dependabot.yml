# Dependabot: keep the noise low.
#
# - Monthly, one grouped PR per ecosystem (minor + patch only).
# - Major versions are NOT proposed automatically. Do them deliberately,
#   e.g. once or twice a year (see TODO.md: React 19, MUI, ESLint 9,
#   TypeScript 7, msw 3, ...): `npm outdated` in frontend/ lists them.
# - Security alerts still show up under the repo's Security tab.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x "minor" that is really breaking: 0.5 requires ESLint 9
      - dependency-name: eslint-plugin-react-refresh
        versions: [">=0.5"]
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Lambda base image (Amazon Linux 2, glibc 2.26) only installs
      # manylinux2014 wheels; newer numpy/scipy releases need glibc 2.28.
      - dependency-name: numpy
        versions: [">=2.3"]
      - dependency-name: scipy
        versions: [">=1.16"]
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /terraform/environments/staging
    schedule:
      interval: monthly
    groups:
      terraform:
        patterns: ["*"]
