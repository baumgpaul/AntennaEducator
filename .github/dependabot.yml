# Weekly dependency update PRs. Grouped per ecosystem to keep the PR count
# low; majors come as separate PRs so breaking upgrades stay reviewable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # MUI majors must move together (material, icons-material,
      # mui-color-input) and need a planned migration (5 -> 7+ changes Grid,
      # removes system props, ...). Minor/patch updates still come through.
      - dependency-name: "@mui/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: mui-color-input
        versions: [">=5"]
      # 0.5 requires ESLint 9 (flat config migration not done yet)
      - dependency-name: eslint-plugin-react-refresh
        versions: [">=0.5"]
      - dependency-name: eslint
        versions: [">=9"]
      # msw 3 no longer intercepts jsdom's XHR in our Vitest setup (requests
      # go out to the network); needs a test-setup migration first
      - dependency-name: msw
        versions: [">=3"]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # bcrypt 5 breaks passlib (local-mode login) — see requirements.txt
      - dependency-name: bcrypt
        versions: [">=5"]
      # The Lambda base image (Amazon Linux 2, glibc 2.26) only installs
      # manylinux2014 wheels; newer numpy/scipy releases need glibc 2.28.
      - dependency-name: numpy
        versions: [">=2.3"]
      - dependency-name: scipy
        versions: [">=1.16"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directory: /terraform/environments/staging
    schedule:
      interval: monthly
