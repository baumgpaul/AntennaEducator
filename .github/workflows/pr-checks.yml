# CI — runs on every pull request to main
# Blocks merging until all checks pass (configure via GitHub branch protection)

name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ── Secret scan: block credentials before they reach the public repo ─
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-pinned)
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan PR commits
        run: |
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --log-opts="origin/${{ github.base_ref }}..HEAD"

  # ── Lambda image dependencies install on the real base image ────────
  # The base image only takes manylinux2014 wheels (glibc 2.26); a too-new
  # numpy/scipy otherwise only fails at deploy time.
  lambda-deps:
    name: Lambda dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: pip install --dry-run in public.ecr.aws/lambda/python:3.11
        run: |
          docker run --rm -v "$PWD/requirements-lambda.txt:/tmp/req.txt:ro"             --entrypoint pip public.ecr.aws/lambda/python:3.11             install --dry-run --only-binary=:all: -r /tmp/req.txt

  # ── Backend: lint + unit tests ──────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,aws]"

      - name: Black (formatting)
        run: black --check backend/ tests/

      - name: isort (imports)
        run: isort --check-only backend/ tests/

      - name: Ruff (linting)
        run: ruff check backend/ tests/

      - name: Unit tests
        run: pytest tests/unit/ -x -q --tb=short --junitxml=junit-backend.xml

      # In-process (TestClient) tests; ones needing running services skip
      - name: Integration tests
        run: pytest tests/integration/ -q --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: junit-backend.xml

  # ── Frontend: lint + typecheck + tests ──────────────────────────────
  fem:
    name: FEM (mesher + solver + service)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            mesher/pyproject.toml
            femsolver/pyproject.toml

      # The gmsh wheel links these X/GL libraries even without a GUI
      - name: Gmsh runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglu1-mesa libxcursor1 libxinerama1 libxft2 > /dev/null

      - name: Install
        run: pip install -e ".[dev]" -e "mesher[dev]" -e "femsolver[dev]" --quiet

      - name: Mesher tests
        run: pytest -q mesher/tests

      - name: Solver tests (physics)
        run: pytest -q femsolver/tests

      - name: FEM service tests (backend/fem)
        run: pytest -q tests/fem

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"  # Node 18 is end-of-life
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Unit tests
        timeout-minutes: 8
        run: npx vitest run --reporter=dot

      # Features in preview (config/features.ts) must not ship in builds
      # without their flag: no chunk, no strings, not even in source maps
      - name: Build without preview flags contains no preview code
        timeout-minutes: 6
        run: |
          VITE_FEATURE_FEM=false npx vite build --outDir /tmp/dist-noflags > /dev/null
          if grep -rlE 'fem-studio|FEM Studio' /tmp/dist-noflags; then
            echo "::error::FEM preview code found in a build without VITE_FEATURE_FEM"
            exit 1
          fi
