# Pre-commit hooks for the Antenna Simulator project.
#
# Setup (run once from the activated .venv):
#   pip install pre-commit && pre-commit install
#
# Run all hooks manually:
#   pre-commit run --all-files

repos:
  # ── General file hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # ── Secrets — block credentials before they are committed ────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── Python — Black formatter ─────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3

  # ── Python — isort import sorter ─────────────────────────────────────
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  # ── Python — Ruff linter ─────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # ── Local hooks — tests (enforced locally before every commit) ───────
  - repo: local
    hooks:
      # Python unit tests (~5 s — fast enough for every commit).
      # Runs the active interpreter: commit with the project venv activated.
      # (A relative .venv/Scripts/python.exe path is not resolvable by
      # pre-commit on Windows, so the hook never actually ran.)
      - id: pytest-unit
        name: pytest unit tests
        language: system
        entry: python -m pytest tests/unit/ -x -q --tb=line --no-header
        types: [python]
        pass_filenames: false

      # FEM mesher subproject (needs: pip install -e "mesher[dev]")
      - id: pytest-mesher
        name: pytest mesher
        language: system
        entry: python -m pytest mesher/tests -x -q --tb=line --no-header -p no:cacheprovider
        files: ^mesher/
        pass_filenames: false

      # FEM solver subproject (needs: pip install -e "femsolver[dev]")
      - id: pytest-femsolver
        name: pytest femsolver
        language: system
        entry: python -m pytest femsolver/tests -x -q --tb=line --no-header -p no:cacheprovider
        files: ^(mesher|femsolver)/
        pass_filenames: false

      # Frontend — ESLint
      - id: frontend-lint
        name: frontend eslint
        language: system
        entry: npm --prefix frontend run lint
        files: ^frontend/src/
        pass_filenames: false

      # Frontend — TypeScript type-check
      # npm --prefix runs the script inside frontend/ so tsconfig is found
      # (npx --prefix ran from the repo root and checked nothing).
      - id: frontend-typecheck
        name: frontend typecheck
        language: system
        entry: npm --prefix frontend run typecheck
        files: ^frontend/src/
        pass_filenames: false

      # Frontend — Vitest unit tests (inside frontend/ so vitest.config.ts and
      # its jsdom environment are used — from the root every DOM test failed)
      - id: frontend-test
        name: frontend tests
        language: system
        entry: npm --prefix frontend run test:run -- --reporter=dot
        files: ^frontend/
        pass_filenames: false
